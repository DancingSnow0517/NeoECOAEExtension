allprojects {
    afterEvaluate {
        if (project.providers.gradleProperty('storageCounterFixture').isPresent()) {
            project.tasks.withType(Test).configureEach {
                classpath = project.files(project.providers.gradleProperty('storageCounterFixture').get()) + classpath
                systemProperty 'neoecoae.counterSnapshotWoven', 'true'
            }
        }
        if (project.providers.gradleProperty('storagePerformanceDiagnostics').isPresent()) {
            project.tasks.withType(Test).configureEach {
                systemProperty 'neoecoae.storagePerformance', 'true'
                reports.junitXml.outputLocation.set(project.layout.buildDirectory.dir('test-results/storage-diagnostics'))
                reports.html.outputLocation.set(project.layout.buildDirectory.dir('reports/storage-diagnostics'))
                binaryResultsDirectory.set(project.layout.buildDirectory.dir('test-results/storage-diagnostics/binary'))
            }
        }
        tasks.register('storagePerformanceClasspath') {
            dependsOn tasks.named('testClasses')
            doLast {
                def destination = project.file(project.providers.gradleProperty('storagePerformanceClasspathFile')
                    .getOrElse('build/storage-performance/classpath.txt'))
                destination.parentFile.mkdirs()
                destination.text = project.sourceSets.test.runtimeClasspath.asPath
            }
        }
    }
}

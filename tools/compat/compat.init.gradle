// Opt-in test JAR, following tools/machine-promo/capture.init.gradle on main.
gradle.projectsEvaluated {
    def project = rootProject
    // Restore the same EMI release without changing the project's normal Maven dependency.
    def lock = new groovy.json.JsonSlurper().parse(project.file('tools/compat/build-dependencies.json'))
    def emi = lock.artifacts.find { it.mod_id == 'emi' }
    def artifact = emi.filename.substring(0, emi.filename.length() - '.jar'.length())
    project.configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module("dev.emi:emi-forge:${emi.version}"))
                .using(module("porting.pinned:${artifact}:${emi.version}"))
        }
    }
    def probe = project.sourceSets.create('compatTest') {
        java.setSrcDirs(['tools/compat/src'])
        resources.setSrcDirs(['tools/compat/resources'])
        compileClasspath += project.sourceSets.main.compileClasspath
    }
    def probeJar = project.tasks.register('compatTestJar', Jar) {
        group = 'verification'
        description = 'Builds the isolated GTL planner compatibility probe.'
        archiveBaseName = 'neoeco-compat-tests'
        from(probe.output)
    }
    project.obfuscation.reobfuscate(probeJar, project.sourceSets.main)
    project.tasks.named('reobfCompatTestJar') {
        // Reobfuscation consumes the main mixin mappings generated by compileJava.
        dependsOn(project.tasks.named('compileJava'))
    }
}

// Use the hash-verified EMI release on CI without configuring the optional probe.
gradle.projectsEvaluated {
    def project = rootProject
    if (project.extensions.extraProperties.has('neoecoaeCiDependenciesConfigured')) return
    project.extensions.extraProperties.set('neoecoaeCiDependenciesConfigured', true)
    def lock = new groovy.json.JsonSlurper().parse(project.file('tools/compat/build-dependencies.json'))
    def emi = lock.artifacts.find { it.mod_id == 'emi' }
    def artifact = emi.filename.substring(0, emi.filename.length() - '.jar'.length())
    // Replace the declaration before ModDevGradle creates its named-mapping constraint.
    // Resolution-time substitution leaves that constraint on the original coordinates,
    // allowing the pinned SRG jar to reach plain JVM tests without remapping.
    def modCompileOnly = project.configurations.getByName('modCompileOnly')
    modCompileOnly.dependencies.removeAll { it.group == 'dev.emi' && it.name == 'emi-forge' }
    project.dependencies.add('modCompileOnly', "porting.pinned:${artifact}:${emi.version}")
}

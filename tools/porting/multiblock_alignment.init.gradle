// Opt-in focused regression task while the imported 1.21.1 test suite is being adapted.
// All production classes still compile through the normal main source set.
gradle.afterProject { project ->
    if (project.path != ':') return
    def main = project.sourceSets.main
    def regression = project.sourceSets.create('multiblockAlignmentTest') {
        java.srcDir 'src/test/java'
        java.srcDir 'src/portingPlatformTest/java'
        java.include 'cn/dancingsnow/neoecoae/multiblock/definition/MultiBlockDefinitionLimitTest.java'
        java.include 'cn/dancingsnow/neoecoae/util/InventoryTestBootstrap.java'
        java.include 'cn/dancingsnow/neoecoae/platform/sync/ManagedRenderUpdateTest.java'
        java.include 'cn/dancingsnow/neoecoae/platform/sync/ManagedInitialSyncTest.java'
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
        runtimeClasspath += project.files("build/moddev/artifacts/client-extra-${project.minecraft_version}-${project.forge_version}.jar")
    }
    project.configurations.multiblockAlignmentTestImplementation.extendsFrom project.configurations.testImplementation
    project.configurations.multiblockAlignmentTestRuntimeOnly.extendsFrom project.configurations.testRuntimeOnly
    project.tasks.register('multiblockAlignmentTest', Test) {
        description = 'Checks multiblock expansion limits against compiled production classes; not the full test suite.'
        group = 'verification'
        testClassesDirs = regression.output.classesDirs
        classpath = regression.runtimeClasspath
        useJUnitPlatform()
    }
}

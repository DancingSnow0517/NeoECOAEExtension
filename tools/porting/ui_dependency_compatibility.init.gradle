// Opt-in validation against the supported minimum or the approved development dependencies.
// Normal builds retain porting/dependencies.lock.json unchanged.
gradle.beforeProject { project ->
    if (project.path != ':') return
    def profile = project.providers.gradleProperty('uiDependencyCompatibility').getOrElse('minimum')
    if (!(profile in ['minimum', 'recommended'])) {
        throw new GradleException("Unknown UI dependency compatibility profile: ${profile}")
    }
    project.layout.buildDirectory = project.file(".porting/ui-dependency-compatibility/${profile}")
    def minimums = [
        [module: 'LDLib1-release', version: '1.0.33.b',
         filename: 'ldlib-forge-1.20.1-1.0.33.b.jar',
         sha256: '5b1c73e63cd665249c79bd28146eac32a9f0838e1643e75b031d7062c393b86a'],
        [module: 'GuideME20-release', version: '20.1.14',
         filename: 'guideme-20.1.14.jar',
         sha256: 'a0ba5a0288dab6e413f1456de8dd162f9479146ee681569837f6d6b17930a0e2']
    ]
    if (profile == 'minimum') {
        minimums.each { dependency ->
            def jar = project.file("libs/ui-compatibility/${dependency.filename}")
            if (!jar.isFile()) throw new GradleException("Missing compatibility JAR: ${jar}")
            def hash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(jar.bytes).encodeHex().toString()
            if (hash != dependency.sha256) {
                throw new GradleException("Compatibility JAR checksum mismatch: ${dependency.filename}")
            }
        }
        project.repositories.ivy {
            name = 'VerifiedUIDependencyCompatibilityJars'
            url = project.file('libs/ui-compatibility').toURI()
            patternLayout { artifact '[artifact].[ext]' }
            metadataSources { artifact() }
            content { includeGroup 'porting.uicompat' }
        }
    }
    project.afterEvaluate {
        // The main build adds the client-only Minecraft classes using its default output path.
        def extraName = "moddev/artifacts/client-extra-${project.minecraft_version}-${project.forge_version}.jar"
        ['test', 'portingPlatformTest', 'upstreamSyncTest'].each { sourceSetName ->
            def sourceSet = project.sourceSets.getByName(sourceSetName)
            sourceSet.runtimeClasspath = sourceSet.runtimeClasspath - project.files("build/${extraName}") +
                project.files(project.layout.buildDirectory.file(extraName))
        }
        if (profile == 'minimum') {
            minimums.each { dependency ->
                // Replace declarations before ModDevGradle attaches named-mapping constraints.
                project.configurations.getByName('modImplementation').dependencies.removeAll {
                    it.group == 'porting.pinned' && it.name == dependency.module
                }
                def artifact = dependency.filename.take(dependency.filename.length() - 4)
                project.dependencies.add('modImplementation',
                    "porting.uicompat:${artifact}:${dependency.version}")
            }
        }
        project.legacyForge.runs.configureEach {
            gameDirectory = project.file("run/ui-dependency-compatibility/${profile}/" +
                project.providers.gradleProperty('portingProfile').getOrElse('base') + "/${name}")
        }
    }
}

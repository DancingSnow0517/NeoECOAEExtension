// Opt-in AE2 addon regressions using actual Mixin transformations and a configurable runtime sample.
// The supplied third-party JAR is used only by this test, never packaged.
gradle.afterProject { project ->
    if (project.path != ':') return
    def sample = project.file(project.providers.gradleProperty('ae2AddonCompatibilitySample')
        .getOrElse('tools/porting/fixtures/ae2-addon-runtime-sample.json'))
    if (!sample.isFile()) throw new GradleException("Missing addon compatibility sample: ${sample}")
    def sampleSpec = new groovy.json.JsonSlurper().parse(sample)
    def addonJarProperty = project.providers.gradleProperty('ae2AddonCompatibilityJar')
    if (!addonJarProperty.isPresent() && !sampleSpec.self_contained) {
        throw new GradleException('Specify -Pae2AddonCompatibilityJar=<installed addon JAR>')
    }
    def addonJar = addonJarProperty.isPresent() ? project.file(addonJarProperty.get()) : null
    if (addonJar != null && !addonJar.isFile()) throw new GradleException("Missing addon JAR: ${addonJar}")
    def ae2JarProperty = project.providers.gradleProperty('ae2AddonCompatibilityAe2Jar')
    def ae2Jar = ae2JarProperty.isPresent() ? project.file(ae2JarProperty.get()) : null
    if (ae2Jar != null && !ae2Jar.isFile()) throw new GradleException("Missing AE2 JAR: ${ae2Jar}")
    def productionJarProperty = project.providers.gradleProperty('ae2AddonCompatibilityProductionJar')
    def productionJar = productionJarProperty.isPresent() ? project.file(productionJarProperty.get()) : null
    if (productionJar != null && !productionJar.isFile()) throw new GradleException("Missing production JAR: ${productionJar}")
    def mixinExtrasJarProperty = project.providers.gradleProperty('ae2AddonCompatibilityMixinExtrasJar')
    def mixinExtrasJar = mixinExtrasJarProperty.isPresent() ? project.file(mixinExtrasJarProperty.get()) : null
    if (mixinExtrasJar != null && !mixinExtrasJar.isFile()) throw new GradleException("Missing MixinExtras JAR: ${mixinExtrasJar}")
    def label = ae2Jar == null ? 'development-ae2' : 'installed-ae2'
    def target = project.providers.gradleProperty('ae2AddonCompatibilityTarget').getOrElse('logic')
    if (!(target in ['logic', 'selection-list', 'craft-confirm', 'crafting-style', 'planning-route', 'planning-wrapper', 'submission-route'])) {
        throw new GradleException("Unknown AE2 addon compatibility target: ${target}")
    }
    if (!sampleSpec.targets.containsKey(target)) {
        throw new GradleException("Sample ${sample.name} has no target: ${target}")
    }
    def selectionList = target == 'selection-list'
    def craftConfirm = target == 'craft-confirm'
    def craftingStyle = target == 'crafting-style'
    def planningRoute = target == 'planning-route'
    def planningWrapper = target == 'planning-wrapper'
    def submissionRoute = target == 'submission-route'
    if (target != 'logic') label += "/${target}"
    label += "/${sample.name.take(sample.name.length() - 5)}"
    if (addonJar != null) label += "/${addonJar.name.take(addonJar.name.length() - 4)}"
    if (productionJar != null) label += '/packaged'

    project.sourceSets.create('ae2AddonCompatibility') {
        java.srcDir 'tools/porting/ae2_addon_compatibility'
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
    }
    project.dependencies.add('ae2AddonCompatibilityImplementation', 'net.minecraft:launchwrapper:1.12') {
        // Use the current Minecraft libraries, not LaunchWrapper's legacy LWJGL/log4j.
        transitive = false
    }
    project.dependencies.add('ae2AddonCompatibilityImplementation', 'org.slf4j:slf4j-api:2.0.16')
    project.dependencies.add('ae2AddonCompatibilityRuntimeOnly', 'org.apache.logging.log4j:log4j-core:2.19.0')
    project.tasks.named('compileAe2AddonCompatibilityJava') {
        options.compilerArgs += ['-proc:none']
    }
    def runs = []
    (selectionList ? ['addon', 'base'] : ['before', 'addon', 'base']).each { mode ->
        def run = project.tasks.register("ae2AddonCompatibility_${mode}", JavaExec) {
            group = 'verification'
            dependsOn project.tasks.named('classes'), project.tasks.named('ae2AddonCompatibilityClasses')
            classpath = project.files(mixinExtrasJar == null ? [] : [mixinExtrasJar]) +
                project.files(ae2Jar == null ? [] : [ae2Jar]) +
                project.files(productionJar == null ? [] : [productionJar]) +
                project.sourceSets.ae2AddonCompatibility.runtimeClasspath +
                project.files(project.layout.buildDirectory.dir('mixin')) +
                project.files(addonJar == null ? [] : [addonJar])
            mainClass = 'cn.dancingsnow.neoecoae.verification.bootstrap.Ae2AddonCompatibility'
            javaLauncher = project.javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(17)
            }
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.export.decompile', 'false'
            systemProperty 'mixin.env.disableRefMap', (selectionList || craftConfirm || planningRoute || planningWrapper) && ae2Jar != null ? 'false' : 'true'
            def directory = project.layout.buildDirectory.dir("ae2-addon-compatibility/${label}/${mode}")
            workingDir = directory
            args mode, target, ae2Jar == null ? 'named' : 'searge', sample.absolutePath
            doFirst { directory.get().asFile.mkdirs() }
        }
        if (!runs.isEmpty()) {
            def previousRun = runs.last()
            run.configure { mustRunAfter previousRun }
        }
        runs.add(run)
    }
    project.tasks.register('ae2AddonCompatibilityTest') {
        description = planningWrapper ? 'Reproduces the startup VerifyError, then verifies shared planning wrappers with the JVM.' :
            planningRoute ? 'Checks native and unknown addon calculation entries use the ECO planner wrapper.' :
            submissionRoute ? 'Checks explicit ECO CPU submission runs before competing automatic selectors.' :
            craftingStyle ? 'Verifies the ECO report style path against an installed addon style redirect.' :
            craftConfirm ? 'Reproduces duplicate confirmation-menu sync IDs, then checks real merged fields and synchronization.' :
            selectionList ? 'Transforms the CPU selection list with all required overlay and formatting hooks.' :
                'Reproduces the old priority failure, then transforms the real AE2 class with and without an addon.'
        group = 'verification'
        dependsOn runs
    }
}

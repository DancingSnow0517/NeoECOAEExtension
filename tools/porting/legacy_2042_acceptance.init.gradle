// Opt-in runtime directory for the 20.4.2 format acceptance. Profile dependencies remain unchanged.
gradle.afterProject { project ->
    if (project.path != ':') return
    if (!project.providers.gradleProperty('legacy2042Smoke').isPresent()) {
        throw new GradleException('Use this script only with -Plegacy2042Smoke=upgrade/read or player-upgrade/player-read')
    }
    project.legacyForge.runs.named('server') {
        gameDirectory = project.file(project.providers.gradleProperty('legacy2042Runtime').getOrElse('run/base/server'))
        if (project.providers.gradleProperty('legacyPlayerSnapshotDirectory').isPresent()) {
            systemProperty 'neoecoae.legacyPlayerSnapshotDirectory',
                project.file(project.providers.gradleProperty('legacyPlayerSnapshotDirectory').get()).absolutePath
        }
    }
}

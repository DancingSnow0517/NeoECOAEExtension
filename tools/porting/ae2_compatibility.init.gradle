// Opt-in compatibility validation; normal builds retain the approved AE2 15.4.11 lock.
// See docs/porting-2026-10-20/AE2_15_4_10_COMPATIBILITY.md for the invocation.
gradle.beforeProject { project ->
    if (project.path != ':') return
    def version = project.providers.gradleProperty('ae2CompatibilityVersion').getOrElse('15.4.11')
    def expectedHashes = [
        '15.4.10': 'fbfee05c6674cb6b00fe425e945ca4818d41eb34069b60dcb4a36221a0390fcc',
        '15.4.11': 'f2ff9ee5122b037d4e93537425ab9fbe49860fc9c3977db13b20a50ca7d30f9e'
    ]
    if (!expectedHashes.containsKey(version)) {
        throw new GradleException("Unsupported compatibility test version: ${version}")
    }
    def jar = project.file(version == '15.4.11' ? 'libs/pinned/AE2-15-release.jar' :
        "libs/ae2-compatibility/AE2-${version}.jar")
    if (!jar.isFile()) throw new GradleException("Missing compatibility JAR: ${jar}")
    def actualHash = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
    if (actualHash != expectedHashes[version]) {
        throw new GradleException("AE2 ${version} compatibility JAR checksum mismatch")
    }
    def artifactName = jar.name.take(jar.name.length() - 4)
    project.repositories.ivy {
        name = 'VerifiedAE2CompatibilityJar'
        url = jar.parentFile.toURI()
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'porting.ae2compat' }
    }
    project.afterEvaluate {
        if (version != '15.4.11') {
            // Replace the declaration before ModDevGradle adds its named-mapping constraints.
            // Substituting the resolved module would lose those constraints and expose raw SRG names.
            project.configurations.getByName('modImplementation').dependencies.removeAll {
                it.group == 'porting.pinned' && it.name == 'AE2-15-release'
            }
            project.dependencies.add('modImplementation', "porting.ae2compat:${artifactName}:${version}")
        }
        project.legacyForge.runs.named('client') {
            systemProperty 'neoecoae.clientSmoke', 'true'
            systemProperty 'neoecoae.ae2ByteTooltipSmoke', 'true'
            systemProperty 'mixin.debug.export', 'true'
            gameDirectory = project.file("run/ae2-compatibility/${version}/" +
                project.providers.gradleProperty('portingProfile').getOrElse('base'))
        }
    }
}

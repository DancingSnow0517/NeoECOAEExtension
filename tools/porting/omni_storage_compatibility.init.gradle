// Isolated validation of the restored approved-main OmniCells adapter.
gradle.beforeProject { project ->
    if (project.path == ':') {
        project.layout.buildDirectory.set(project.file('.porting/omni-disk-compatibility/build'))
    }
}
gradle.afterProject { project ->
    if (project.path != ':') return
    def regression = project.sourceSets.create('omniCompatibilityTest') {
        java.srcDir 'src/test/java'
        java.include 'cn/dancingsnow/neoecoae/integration/ae2omnicells/**'
        java.include 'cn/dancingsnow/neoecoae/util/InventoryTestBootstrap.java'
        java.include 'cn/dancingsnow/neoecoae/util/LargeWorkstationTestKeys.java'
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.files(project.layout.buildDirectory.file(
            "moddev/artifacts/client-extra-${project.minecraft_version}-${project.forge_version}.jar"))
    }
    project.configurations.omniCompatibilityTestImplementation.extendsFrom project.configurations.testImplementation
    project.configurations.omniCompatibilityTestRuntimeOnly.extendsFrom project.configurations.testRuntimeOnly
    project.tasks.register('omniCompatibilityTest', Test) {
        testClassesDirs = regression.output.classesDirs
        classpath = regression.runtimeClasspath
        useJUnitPlatform()
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def runtimeProfiles = [
    base: [],
    extended: ['expatternprovider', 'glodium'],
    advanced: ['advanced_ae', 'geckolib'],
    plus: ['expatternprovider', 'glodium', 'extendedae_plus'],
    lightning: ['ae2lt', 'thunderbolt'],
    omni: ['ae2omnicells'],
    storage: ['appbot', 'botania', 'curios', 'patchouli', 'appflux', 'glodium',
              'appmek', 'mekanism', 'mekanismgenerators', 'megacells', 'cloth_config', 'ae2omnicells'],
    storageMinimal: ['megacells', 'cloth_config'],
    combined: ['expatternprovider', 'glodium', 'advanced_ae', 'geckolib',
               'extendedae_plus', 'ae2lt', 'thunderbolt']
]
runtimeProfiles.storageAll = runtimeProfiles.storage + [
    'bigger_ae2', 'appliedpneumatics', 'pneumaticcraft', 'arseng', 'ars_nouveau', 'geckolib',
    'ae2lt', 'thunderbolt'
]
def portingProfile = providers.gradleProperty('portingProfile').getOrElse('base')
if (!runtimeProfiles.containsKey(portingProfile)) {
    throw new GradleException("Unknown portingProfile '${portingProfile}'; choose ${runtimeProfiles.keySet()}")
}
def dependencyLock = new groovy.json.JsonSlurper().parse(file('porting/dependencies.lock.json'))
def releaseJars = dependencyLock.artifacts.collectEntries { artifact ->
    def artifactFile = file("libs/pinned/${artifact.filename}")
    if (!artifactFile.isFile()) {
        throw new GradleException("Missing pinned release ${artifact.filename}; download it from porting/dependencies.lock.json into libs/pinned/ before building.")
    }
    def actualHash = java.security.MessageDigest.getInstance('SHA-256')
        .digest(artifactFile.bytes).encodeHex().toString()
    if (actualHash != artifact.sha256) {
        throw new GradleException("Pinned release checksum mismatch: ${artifact.mod_id}")
    }
    [(artifact.mod_id): artifactFile]
}
def releaseVersions = [ae2: ae2_version, guideme: guideme_version, ldlib: ldlib_version,
    advanced_ae: '1.3.6-1.20.1', expatternprovider: '1.20-1.4.21-forge',
    extendedae_plus: '1.6.3', ae2lt: '2.1.2-beta2', thunderbolt: '2.0.3-beta2',
    glodium: '1.20-1.5-forge', geckolib: '4.8.4', ae2omnicells: '1.1.6-1.20.1-forge',
    appbot: '1.5.2-forge', appflux: '1.20-1.3.7-forge', appmek: '1.4.3',
    megacells: '2.4.6-1.20.1', botania: '1.20.1-455-FORGE', mekanism: '10.4.16.80',
    mekanismgenerators: '10.4.16.80',
    cloth_config: '11.1.136-forge', curios: '5.14.1+1.20.1', patchouli: '1.20.1-85-FORGE',
    bigger_ae2: '20.2.1', appliedpneumatics: '1.0.8', pneumaticcraft: '6.0.23',
    arseng: '1.2.0', ars_nouveau: '4.12.7']
def pinned = { String mod ->
    "porting.pinned:${releaseJars[mod].name.take(releaseJars[mod].name.length() - 4)}:${releaseVersions[mod]}"
}
repositories {
    ivy {
        name = 'VerifiedReleaseJars'
        url = uri('libs/pinned')
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'porting.pinned' }
    }
    mavenCentral()
    maven {
        url = 'https://modmaven.dev'
        content { includeGroup 'appeng' }
    }
    maven {
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content { includeGroup 'com.lowdragmc.ldlib' }
    }
    maven {
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'org.spongepowered' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
}

// The headless render tests use Minecraft 1.20.1's LWJGL without opening a game window.
def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def lwjglNatives = hostOs.contains('windows') ? 'natives-windows' :
    hostOs.contains('mac') ? 'natives-macos' : 'natives-linux'
if (hostArch in ['aarch64', 'arm64']) lwjglNatives += '-arm64'
else if (hostArch in ['x86', 'i386'] && hostOs.contains('windows')) lwjglNatives += '-x86'

dependencies {
    ['ae2', 'guideme', 'ldlib'].each { modImplementation pinned(it) }
    ['advanced_ae', 'expatternprovider', 'extendedae_plus', 'ae2lt', 'thunderbolt',
     'glodium', 'geckolib', 'ae2omnicells', 'appbot', 'appflux', 'appmek', 'megacells',
     'mekanism', 'botania', 'cloth_config', 'bigger_ae2'].each { modCompileOnly pinned(it) }
    modCompileOnly 'porting.pinned:AE2AddonLib20-embedded:1.0.4-1.20.1'
    runtimeProfiles[portingProfile].each { modRuntimeOnly pinned(it) }
    modApi "com.tterrag.registrate:Registrate:${registrate_version}"
    jarJar "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    jarJar "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Exercise optional per-recipe layout hooks against the same JEI release as the API.
    testRuntimeOnly('mezz.jei:jei-1.20.1-forge:15.48.0.177') { transitive = false }
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb'].each {
        testRuntimeOnly "org.lwjgl:${it}:3.3.1:${lwjglNatives}"
    }
    modCompileOnly 'mezz.jei:jei-1.20.1-forge-api:15.48.0.177'
    modCompileOnly 'mezz.jei:jei-1.20.1-common-api:15.48.0.177'
    modCompileOnly 'dev.emi:emi-forge:1.1.24+1.20.1:api'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            if (providers.gradleProperty('storageAcceptanceWorld').isPresent()) {
                programArguments.addAll '--world', providers.gradleProperty('storageAcceptanceWorld').get(), '--port', '25596'
            }
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = project.file(providers.gradleProperty('multiblockAlignmentSmoke').isPresent()
                ? "run/multiblock-alignment/${portingProfile}/${name}" : "run/${portingProfile}/${name}")
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'neoecoae.bootstrapSmoke', providers.gradleProperty('bootstrapSmoke').getOrElse('false')
            systemProperty 'neoecoae.clientSmoke', providers.gradleProperty('clientSmoke').getOrElse('false')
            systemProperty 'neoecoae.clientSmokeMenus', providers.gradleProperty('clientSmokeMenus').getOrElse('false')
            systemProperty 'neoecoae.clientSmokeInventories', providers.gradleProperty('clientSmokeInventories').getOrElse('false')
            systemProperty 'neoecoae.upstreamSyncSmoke', providers.gradleProperty('upstreamSyncSmoke').getOrElse('false')
            systemProperty 'neoecoae.workstationModelSmoke', providers.gradleProperty('workstationModelSmoke').getOrElse('')
            systemProperty 'neoecoae.multiblockAlignmentSmoke', providers.gradleProperty('multiblockAlignmentSmoke').getOrElse('')
            systemProperty 'neoecoae.clientSmokeEnergy', providers.gradleProperty('clientSmokeEnergy').getOrElse('false')
            systemProperty 'neoecoae.storageSavedDataSmoke', providers.gradleProperty('storageSavedDataSmoke').getOrElse('')
            systemProperty 'neoecoae.legacy2042Smoke', providers.gradleProperty('legacy2042Smoke').getOrElse('')
            systemProperty 'neoecoae.optionalStorageSmoke', providers.gradleProperty('optionalStorageSmoke').getOrElse('')
        }
    }
    mods {
        neoecoae { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
def ecoMixinConfigs = ['neoecoae.mixins.json', 'neoecoae.compat.advanced_ae.mixins.json',
    'neoecoae.compat.ae2omnicells.mixins.json',
    'neoecoae.compat.extendedae.mixins.json', 'neoecoae.compat.thunderbolt.mixins.json',
    'neoecoae.terminal_big_amount.mixins.json']
mixin {
    add sourceSets.main, 'neoecoae.refmap.json'
    ecoMixinConfigs.each { config it }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))

// Compile a small, explicitly named set of real platform-independent production contracts.
// This does not exclude any main sources or imply that the full port currently compiles.
sourceSets {
    portingContracts {
        java.srcDir 'src/main/java'
        java.include 'cn/dancingsnow/neoecoae/platform/JdkCompat.java'
    }
    portingContractsTest {
        compileClasspath += sourceSets.portingContracts.output
        runtimeClasspath += sourceSets.portingContracts.output
    }
    portingPlatform {
        java.srcDir 'src/main/java'
        java.include 'cn/dancingsnow/neoecoae/platform/sync/**'
        java.include 'cn/dancingsnow/neoecoae/platform/ForgeBlockCapabilities.java'
        java.include 'cn/dancingsnow/neoecoae/platform/ui/**'
        java.include 'cn/dancingsnow/neoecoae/platform/network/**'
        java.include 'cn/dancingsnow/neoecoae/platform/recipe/**'
        java.include 'cn/dancingsnow/neoecoae/platform/nbt/**'
        java.include 'cn/dancingsnow/neoecoae/api/components/AutoExportSides.java'
        java.include 'cn/dancingsnow/neoecoae/api/ECOTier.java'
        java.include 'cn/dancingsnow/neoecoae/api/IECOTier.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/StorageByteAccounting.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/StorageInterfaceFilter.java'
        java.include 'cn/dancingsnow/neoecoae/all/NERecipeTypes.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/IntegratedWorkingStationRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/IntegratedWorkingStationRecipeBuilder.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/CoolingRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/CoolingRecipeBuilder.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/LargeIntegratedWorkingStationRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/ExtendedCrystalAssemblerRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/StorageCellDisassemblyRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/LargeWorkstationRecipe.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/LargeWorkstationModule.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/LargeWorkstationRecipes.java'
        java.include 'cn/dancingsnow/neoecoae/recipe/LargeWorkstationRecipeAdapters.java'
        java.include 'cn/dancingsnow/neoecoae/mixins/minecraft/RecipeManagerAccessor.java'
        java.include 'cn/dancingsnow/neoecoae/gui/common/FluidHatchUI.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/persistence/**'
        java.include 'cn/dancingsnow/neoecoae/util/CellHostItemHandler.java'
        java.include 'cn/dancingsnow/neoecoae/util/ICellHost.java'
        java.include 'cn/dancingsnow/neoecoae/api/storage/ICellHost.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/ECOInfiniteStorageData.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/ECOInfiniteStorageDomains.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/ECOInfiniteStorageEngine.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/SavedDataInfiniteStorageEngine.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/LegacyInfiniteStorageReader.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/HugeAmount.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/InfiniteStorageAmounts.java'
        java.include 'cn/dancingsnow/neoecoae/impl/storage/infinite/MutableInfiniteStorageTotal.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOBatchCraftingHelper.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/amount/NEMath.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOFastPathStacks.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOReusableStateModel.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOStateTransitionBatchModel.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECODurabilityBatchModel.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOCombinedStateModel.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOReusableStateAnalyzer.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/fastpath/ECOCraftingStateSlots.java'
        java.include 'cn/dancingsnow/neoecoae/blocks/entity/LargeWorkstationCoolingOutput.java'
        java.include 'cn/dancingsnow/neoecoae/api/me/bigorder/ECOExactInventory.java'
        java.include 'cn/dancingsnow/neoecoae/crafting/execution/worker/ECOExactVirtualLedger.java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
        resources.srcDir 'src/main/resources'
        resources.include 'assets/neoecoae/screens/fluid_hatch.json'
    }
    portingPlatformTest {
        compileClasspath += sourceSets.portingPlatform.output + sourceSets.portingPlatform.compileClasspath
        runtimeClasspath += sourceSets.portingPlatform.output + sourceSets.portingPlatform.runtimeClasspath
        runtimeClasspath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
    }
    upstreamSyncTest {
        java.srcDir 'src/test/java'
        java.includes = file('porting/upstream-sync-test-sources.txt').readLines('UTF-8')
            .findAll { !it.isBlank() && !it.startsWith('#') }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
        runtimeClasspath += files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
    }
}
configurations.portingContractsTestImplementation.extendsFrom configurations.testImplementation
configurations.portingContractsTestRuntimeOnly.extendsFrom configurations.testRuntimeOnly
configurations.portingPlatformTestImplementation.extendsFrom configurations.testImplementation
configurations.portingPlatformTestRuntimeOnly.extendsFrom configurations.testRuntimeOnly
configurations.upstreamSyncTestImplementation.extendsFrom configurations.testImplementation
configurations.upstreamSyncTestRuntimeOnly.extendsFrom configurations.testRuntimeOnly
dependencies {
    portingPlatformAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}
tasks.register('portingContractsTest', Test) {
    description = 'Tests isolated Java 17 production contracts; full main compilation is a separate gate.'
    group = 'verification'
    testClassesDirs = sourceSets.portingContractsTest.output.classesDirs
    classpath = sourceSets.portingContractsTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('portingPlatformTest', Test) {
    description = 'Validates real Forge/LDLib1 platform adapters independently of unfinished business-source migration.'
    group = 'verification'
    testClassesDirs = sourceSets.portingPlatformTest.output.classesDirs
    classpath = sourceSets.portingPlatformTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('upstreamSyncTest', Test) {
    description = 'Runs the complete selected upstream increment regressions against the fully compiled Forge implementation.'
    group = 'verification'
    testClassesDirs = sourceSets.upstreamSyncTest.output.classesDirs
    classpath = sourceSets.upstreamSyncTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '2G'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', providers.gradleProperty('portingMaxErrors').getOrElse('1000')]
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

tasks.named('processResources', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_authors: mod_authors, mod_license: mod_license]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': mod_name,
                        'Implementation-Version': mod_version,
                        'MixinConfigs': ecoMixinConfigs.join(','))
}

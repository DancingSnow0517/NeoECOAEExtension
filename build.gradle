plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'io.freefair.lombok' version '8.7.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// AppBot's 1.21.1 release uses the matching Botania development build.
def enableAppBotIntegration = providers.gradleProperty('enableAppBotIntegration')
    .map { it.toBoolean() }
    .getOrElse(true)

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = "Data Energistics releases"
                url = "https://github.com/ModularMCLib/DataEnergistics/releases/download"
                patternLayout {
                    artifact "v[revision]-1.21/data_energistics-1.21.1-[revision].[ext]"
                }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup "github.dataenergistics" }
    }
    flatDir {
        dir("libs")
    }
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseForge Maven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven { // Registrate
        url "https://maven.gegy.dev/releases"
    }
    maven {// Ldlib
        name "firstdarkdev"
        url "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023, botania
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven {
        // kubejs
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven {
        // emi
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.minecraftforge.net/" }
}

configurations {
    curiosDevMod
    devMods
    createDevMod
}

dependencies {
    curiosDevMod("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1") { transitive = false }
    devMods("curse.maven:applied-pneumatics-1355087:8812885") { transitive = false }
    devMods("curse.maven:pneumaticcraft-repressurized-281849:8519226") { transitive = false }
    devMods("curse.maven:applied-experienced-1157608:7705498") { transitive = false }
    devMods("curse.maven:applied-soul-1337114:8711537") { transitive = false }
    devMods("curse.maven:soulplied-energistics-1143614:8333758") { transitive = false }
    devMods("curse.maven:experiencelib-1156551:7705470") { transitive = false }
    // Useless Mod's laser drill adapters require the generic DrillRecipe API from 3.6.36.
    devMods("curse.maven:industrial-foregoing-266515:7073719") { transitive = false }
    devMods("curse.maven:industrial-foregoing-souls-904394:6235883") { transitive = false }
    devMods("curse.maven:titanium-287342:7951516") { transitive = false }
    devMods("curse.maven:patchouli-306770:7730942") { transitive = false }
    devMods("curse.maven:jade-324717:8591319") { transitive = false }
    devMods("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    devMods("curse.maven:ae2-jei-integration-1074338:7727898") { transitive = false }
    // All storage-cell integrations share the same development client.
    devMods("maven.modrinth:applied-replicatics:nQ4pLTkV") { transitive = false } // 21.1-1.2.1
    devMods("maven.modrinth:replication:XfQXDcjc") { transitive = false } // 1.21.1-1.2.7
    devMods("maven.modrinth:kotlin-for-forge:uhJhCT7X") { transitive = false } // 5.12.0
    devMods("maven.modrinth:applied-create:2bWngfNH") { transitive = false } // 1.1.7
    createDevMod("maven.modrinth:create:UjX6dr61") { transitive = false } // 6.0.10, embeds Flywheel/Ponder
    devMods("github.dataenergistics:data-energistics:3.3.5@jar") { transitive = false }
    // Data Energistics embeds Configuration 3.1.1; do not install a second standalone copy.
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.mockito:mockito-core:5.15.2')
    // Verify custom JEI bookmark conversion against the optional addon's public API.
    testImplementation("curse.maven:ae2-jei-integration-1074338:7727898") { transitive = false }
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    // Exercise the optional search bridges against released upstream APIs; neither mod is bundled.
    testRuntimeOnly("curse.maven:just-enough-characters-250702:8771217") { transitive = false }
    testImplementation("curse.maven:extendedae-plus-1337639:8755074") { transitive = false }
    // KeyMapping/EditBox tests need GLFW's native entry points, but never create a game window.
    def nativeOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def nativeClassifier = nativeOs.contains('win') ? 'natives-windows'
        : nativeOs.contains('mac') ? 'natives-macos' : 'natives-linux'
    if (System.getProperty('os.arch') in ['aarch64', 'arm64']) nativeClassifier += '-arm64'
    testRuntimeOnly("org.lwjgl:lwjgl:3.3.3:${nativeClassifier}")
    testRuntimeOnly("org.lwjgl:lwjgl-glfw:3.3.3:${nativeClassifier}")
    // Inspect the released optional target's bytecode without installing it in the dev runtime.
    testRuntimeOnly("curse.maven:flux-networks-248020:6089446") { transitive = false }
    api("com.tterrag.registrate:Registrate:MC1.21.1-1.4.8")
    jarJar("com.tterrag.registrate:Registrate:MC1.21.1-1.4.8")

    compileOnly("org.appliedenergistics:guideme:21.1.1:api")
    runtimeOnly("org.appliedenergistics:guideme:21.1.1")

    implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}") {
        version { strictly(ae2_version) }
    }

    // Optional alloy-furnace scaled dispatch API; not bundled or installed in the dev runtime.
    // Requires 2.3.7.2+ for AlloyFurnaceBigIntegerTarget public API (introduced 2026-09-18)
    compileOnly("maven.modrinth:a-useless-mod:VX1feqRC") { transitive = false } // 1.21.1-2.3.8

    // Optional transfer fast path. Never place this on the default runtime classpath.

    // Optional OmniSequence v1 batch API. Compile against the upstream classes without installing the mod at runtime.
    compileOnly("curse.maven:omnisequence-transfinite-1624558:8991983") { transitive = false }

    // Pattern-disk API: AE2 Pattern Disk publishes PatternDiskApi for integrations whose machines hold pattern
    // disks. The integration still does not require the mod - the guard in PatternDiskIntegration stands it down
    // when the mod is absent, and a machine that never holds a disk behaves as it did before. Declared as
    // implementation rather than compileOnly so the dev runtime loads it and the integration can be exercised.
    //
    // 0.7.1 is the first release this integration accepts: it added maxPatterns (api 9), which the integration
    // probes for as its version floor, and the coordinates below are that release. Anything older stands the
    // integration down with one log line rather than misbehaving.
    //
    // The probe reads the api by reflection, so the version compiled against and the version installed are
    // independent: a player running a newer AE2 Pattern Disk than this build is fine, and one running an older
    // release gets the stand-down rather than a broken machine.
    //
    // Sourced from CurseForge rather than Modrinth: this project does not resolve through Modrinth's maven
    // at all - both the version number and the version id answer 404 there while the file itself downloads
    // from its CDN - and CI hit exactly that. The file id is the 0.7.1 upload of project 1698612.
    implementation("curse.maven:ae2-pattern-disk-1698612:9009050") { transitive = false }
    runtimeOnly("maven.modrinth:applied-energistics-2-wireless-terminals:19.5.1") { transitive = false }

    // Optional integration target. 4.11.0 is the verified 1.21.1 build (AE2 >= 19.2.15).
    compileOnly("curse.maven:mega-cells-622112:7952621") { transitive = false }
    runtimeOnly("curse.maven:mega-cells-622112:7952621") { transitive = false }

    implementation("curse.maven:omni-cells-1359517:8050965")

    // Compile and install the same Lightning/Thunderbolt pair in the development client.
    def localAe2LtJar = providers.gradleProperty("ae2lt_local_jar").orNull
    if (localAe2LtJar) {
        compileOnly(files(localAe2LtJar))
        testImplementation(files(localAe2LtJar))
        devMods(files(localAe2LtJar))
    } else {
        compileOnly("maven.modrinth:ae2-lightning-tech:AosdXlfS") { transitive = false } // 2.1.2-beta3
        testImplementation("maven.modrinth:ae2-lightning-tech:AosdXlfS") { transitive = false }
        devMods("maven.modrinth:ae2-lightning-tech:AosdXlfS") { transitive = false }
    }
    compileOnly("maven.modrinth:thunderbolt-core:oyVnlG5A") { transitive = false } // 2.0.3-beta2
    testImplementation("maven.modrinth:thunderbolt-core:oyVnlG5A") { transitive = false }
    devMods("maven.modrinth:thunderbolt-core:oyVnlG5A") { transitive = false }
    // JDT Time Accelerators is optional and requires the separate
    // Just Dire Things mod, so it is not included in the default dev runtime.
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }
    compileOnly("org.appliedenergistics.yoga:yoga:${yoga_version}")
    compileOnly("dev.vfyjxf:taffy:${taffy_version}")

    implementation("curse.maven:mekanism-268560:7904058")
    implementation("curse.maven:applied-mekanistics-574300:7096962")

    implementation("curse.maven:glodium-957920:5821676")
    implementation("curse.maven:ex-pattern-provider-892005:8811572")
    implementation("curse.maven:applied-flux-965012:8204513")

    implementation("curse.maven:advancedae-1084104:8564177")

    // Jade is a client-side integration. Keep its API available for compilation,
    // but only add the implementation to NeoForge's client runtime.
    compileOnly("curse.maven:jade-324717:8591319") { transitive = false }

    if (enableAppBotIntegration) {
        // Compile the Mana cell integration against the same Botania/AppBot pair used by runClient.
        compileOnly("vazkii.botania:botania-neoforge-1.21.1:${botania_version}@jar") { transitive = false }
        compileOnly("maven.modrinth:applied-botanics:leZwUP1X") { transitive = false } // 1.6.0-alpha.3
        devMods("vazkii.botania:botania-neoforge-1.21.1:${botania_version}@jar") { transitive = false }
        devMods("maven.modrinth:applied-botanics:leZwUP1X") { transitive = false }
    }

    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.9.4.1182") {
        // The Ars Nouveau POM pins an older JEI build; use the project-wide client version instead.
        exclude group: "mezz.jei", module: "jei-${minecraft_version}-neoforge"
        // Jade is supplied separately by the client run configuration; do not let Ars Nouveau
        // pin an older CurseForge build into runtimeClasspath's consistent-resolution set.
        exclude group: "curse.maven", module: "jade-324717"
        exclude group: "top.theillusivec4.curios", module: "curios-neoforge"
    }
    implementation("curse.maven:ars-energistique-905641:6203425")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("dev.emi:emi-neoforge:${emi_version}")

    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")

    // KubeJS integration API used by the recipe schema plugin.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
    systemProperty 'storage.performance', providers.systemProperty('storage.performance').getOrElse('false')
    systemProperty 'storage.performance.label', providers.systemProperty('storage.performance.label').getOrElse('current')
    systemProperty 'storage.performance.extended', providers.systemProperty('storage.performance.extended').getOrElse('false')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        aeGuide {
            client()

            systemProperty 'guideme.ae2.guide.sources', file('guidebook').absolutePath
            systemProperty 'guideme.ae2.guide.sourcesNamespace', 'neoecoae'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
            jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.java {
    if (!enableAppBotIntegration) {
        exclude 'cn/dancingsnow/neoecoae/integration/appbot/**'
    }
}

// ModDev supplies Minecraft to main; isolated JVM contract tests need the same game classes.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

sourceSets.main.resources {
    srcDirs 'src/generated/resources'
    exclude 'kubejs.plugins.txt'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The dev launcher discovers Curios only when its JAR is in run/mods. Keep it
// off the Java module path to avoid loading the same module twice.
// Create's embedded Registrate would otherwise duplicate our runtimeClasspath copy.
abstract class PrepareCreateDevMod extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getSourceJar()

    @OutputFile
    abstract RegularFileProperty getPreparedJar()

    @TaskAction
    void prepare() {
        def output = preparedJar.get().asFile
        output.parentFile.mkdirs()
        new java.util.zip.ZipFile(sourceJar.get().asFile).withCloseable { source ->
            def metadataPath = 'META-INF/jarjar/metadata.json'
            def metadata = source.getInputStream(source.getEntry(metadataPath)).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            def redundant = metadata.jars.findAll {
                it.identifier.group == 'com.tterrag.registrate' && it.identifier.artifact == 'Registrate'
            }.collect { it.path }.toSet()
            metadata.jars.removeAll { redundant.contains(it.path) }
            new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { target ->
                source.entries().each { entry ->
                    if (!redundant.contains(entry.name)) {
                        target.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (entry.name == metadataPath) {
                            target.write(groovy.json.JsonOutput.toJson(metadata).getBytes('UTF-8'))
                        } else {
                            source.getInputStream(entry).withCloseable { it.transferTo(target) }
                        }
                        target.closeEntry()
                    }
                }
            }
        }
    }
}

def prepareCreateDevMod = tasks.register('prepareCreateDevMod', PrepareCreateDevMod) {
    sourceJar.set(layout.file(configurations.createDevMod.elements.map { it.iterator().next().asFile }))
    preparedJar.set(layout.buildDirectory.file('dev-mods/create-UjX6dr61.jar'))
}

def installCuriosDevMod = tasks.register("installCuriosDevMod", Copy) {
    from(configurations.curiosDevMod, configurations.devMods)
    from(prepareCreateDevMod.flatMap { it.preparedJar })
    into(layout.projectDirectory.dir("run/mods"))
}

tasks.named("runClient").configure {
    dependsOn(installCuriosDevMod)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('copyGuidebook', Copy) {
    group = 'build'

    from 'guidebook/'
    into 'src/main/resources/assets/neoecoae/ae2guide'
}

tasks.named('processResources') {
    dependsOn tasks.named('copyGuidebook')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Freefair 8.7.1 passes whole source directories to delombok, ignoring source-set exclusions.
def prepareDelombokSources = tasks.register('prepareDelombokSources', Sync) {
    from sourceSets.main.java
    into layout.buildDirectory.dir('delombok-input/main')
}

// Override after the plugin installs its directory inputs in afterEvaluate.
afterEvaluate {
    tasks.named('delombok') {
        dependsOn prepareDelombokSources
        input.setFrom(prepareDelombokSources)
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn delombok
    from delombok.outputs.files
    archiveClassifier = "sources"
}

artifacts {
    archives sourcesJar
}


lombok {
    version = "1.18.34"
}

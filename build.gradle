    // ported 26.1.2 counterpart yet. These are the 1.21.1 builds main compiles against; the
    // bridges that touch them are gated off at runtime (see NeoECOAE.UNPORTED_INTEGRATIONS),
    // so none of these classes are ever loaded.
    legacyCompileOnly("curse.maven:advancedae-1084104:8564177")
    legacyCompileOnly("curse.maven:extendedae-plus-1337639:8755074")
    legacyCompileOnly("maven.modrinth:ae2-lightning-tech:wchBNoWt")
    legacyCompileOnly("maven.modrinth:thunderbolt-core:i3H7uX2O")
    legacyCompileOnly("maven.modrinth:a-useless-mod:VX1feqRC")
    legacyCompileOnly("curse.maven:omnisequence-transfinite-1624558:8991983")
    legacyCompileOnly("curse.maven:ae2-pattern-disk-1698612:9009050")
    legacyCompileOnly("curse.maven:mekanism-268560:7904058")
    legacyCompileOnly("curse.maven:applied-flux-965012:8204513")
    legacyCompileOnly("github.biggerae2:bigger_ae2:21.2.3")
    legacyCompileOnly("curse.maven:flux-networks-248020:6089446")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    api("com.tterrag.registrate:Registrate:MC26.1-1.5.4")
    jarJar("com.tterrag.registrate:Registrate:MC26.1-1.5.4")

    implementation("org.appliedenergistics:appliedenergistics2:26.1.10-beta")
    implementation("org.appliedenergistics:guideme:26.1.12-beta")

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}")
    compileOnly("dev.vfyjxf:taffy:${taffy_version}")

    // implementation("curse.maven:applied-mekanistics-574300:7096962")

    implementation("curse.maven:glodium-957920:8196173")
    implementation("curse.maven:ex-pattern-provider-892005:8237330")
    // implementation("curse.maven:applied-flux-965012:8204513")

    // implementation("curse.maven:advancedae-1084104:7374386")

    implementation("maven.modrinth:jade:26.1.3+neoforge")

    // implementation("vazkii.botania:botania-neoforge-1.21.1:454-SNAPSHOT")
    // implementation("curse.maven:applied-botanics-addon-610632:7234122")
    // implementation(name: "appbot-1.6.0")

    // implementation("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.9.4.1182")
    // implementation("curse.maven:ars-energistique-905641:6203425")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // compileOnly("dev.emi:emi-neoforge:${emi_version}")

    // implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")

    // api("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
    // interfaceInjectionData("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
}

neoForge {
    version = project.neo_version

//    parchment {
//        mappingsVersion = project.parchment_mappings_version
//        minecraftVersion = project.parchment_minecraft_version
//    }

    runs {
        client {
            client()
            // `./gradlew runClient -PquickPlay=<world>` opens a singleplayer world directly.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        aeGuide {
            client()

            systemProperty 'guideme.ae2.guide.sources', file('guidebook').absolutePath
            systemProperty 'guideme.ae2.guide.sourcesNamespace', 'neoecoae'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
            jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources', 'src/guidebook/resources'
}

sourceSets.main.java {
    // 26.1.2 port: leaf integrations whose target mod has no ported 26.1.2 build yet.
    // Nothing in the core references these packages; see docs/26.1-migration-reduction-notes.md.
    exclude 'cn/dancingsnow/neoecoae/integration/ae2omnicells/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appbot/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedcreate/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedpneumatics/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedsoul/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appmek/**'
    exclude 'cn/dancingsnow/neoecoae/integration/apprep/**'
    exclude 'cn/dancingsnow/neoecoae/integration/arsenergistique/**'
    exclude 'cn/dancingsnow/neoecoae/integration/dataenergistics/**'
    exclude 'cn/dancingsnow/neoecoae/integration/emi/**'
    exclude 'cn/dancingsnow/neoecoae/integration/kubejs/**'
    exclude 'cn/dancingsnow/neoecoae/integration/megacells/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/advancedae/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/ae2omnicells/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/appbot/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/fluxnetworks/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/omnisequence/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/thunderbolt/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/useless/**'
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('copyGuidebook', Copy) {
    group = 'build'

    from 'guidebook/'
    into 'src/guidebook/resources/assets/neoecoae/ae2guide'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn delombok
    from delombok.outputs.files
    archiveClassifier = "sources"
}

artifacts {
    archives sourcesJar
}


lombok {
    version = "1.18.46"
}

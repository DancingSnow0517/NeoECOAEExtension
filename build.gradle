plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '9.5.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // 1.21.1 builds of optional integration targets, used only as compile-time API stubs
    // (see the legacyCompileOnly configuration). Never installed in any run.
    exclusiveContent {
        forRepository {
            ivy {
                name = "Bigger AE2 releases"
                url = "https://github.com/DancingSnow0517/BiggerAE2/releases/download"
                patternLayout {
                    artifact "[revision]/bigger_ae2-1.21.1-[revision].[ext]"
                }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup "github.biggerae2" }
    }
    flatDir {
        dir("libs")
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseForge Maven"
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // Registrate Fork
        name = "Ithundxr Maven"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {// Ldlib
        name "firstdarkdev"
        url "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023, botania
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven {
        // kubejs
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven {
        // emi
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.minecraftforge.net/" }
    maven { // Registrate
        url "https://maven.gegy.dev/releases"
    }
}

configurations {
    legacyCompileOnly { transitive = false }
    compileOnly.extendsFrom legacyCompileOnly
    integrationApi { transitive = false }
    integrationCompileOnly { transitive = false }
    compileOnly.extendsFrom integrationCompileOnly
    testImplementation.extendsFrom integrationCompileOnly
    integrationRuntime { transitive = false }
    compileOnly.extendsFrom integrationApi
    testImplementation.extendsFrom integrationApi
    testRuntimeOnly.extendsFrom integrationRuntime
    if (project.hasProperty('withIntegrations')) {
        localRuntime.extendsFrom integrationApi, integrationRuntime
    }
}

dependencies {
    // ---- 26.1.2 port: compile-time-only API of optional integrations that have no
    // ported 26.1.2 counterpart yet. These are the 1.21.1 builds main compiles against; the
    // bridges that touch them are gated off at runtime (see NeoECOAE.UNPORTED_INTEGRATIONS),
    // so none of these classes are ever loaded.
    // ---- Optional integrations ported to their 26.1.2 builds (compile against the real API).
    // `./gradlew runClient -PwithIntegrations` also installs them in the dev client.
    integrationApi("maven.modrinth:advancedae:hPJMJOBd")            // 26.1.7
    // EAEP 1.6.3 for 26.1.2 cannot load next to any 26.1 ExtendedAE build (its ClusterAssemblerMatrixMixin
    // shadows `availableCrafters` as a ReferenceSet; every ExtendedAE 26.1 release declares a Set), so it is
    // compiled/tested against but not installed by -PwithIntegrations. Upstream issue, not ours.
    integrationCompileOnly("maven.modrinth:extendedae-plus:W9WXH7F7") // 1.6.3
    integrationApi("maven.modrinth:bigger-ae2:VsHV30Lz")            // 26.1.2.2.1
    integrationApi("curse.maven:applied-flux-965012:9304490")       // 26.1-1.0.4
    integrationApi("maven.modrinth:ae2-omni-cells:wv0rLPsF")        // 1.1.7-26.1.2
    integrationApi("maven.modrinth:applied-replicatics:viswoEhd")   // 26.1-1.0.0
    integrationApi("maven.modrinth:replication:KvcBmwKg")           // 26.1.2-1.2.8
    integrationApi("maven.modrinth:kubejs:5yNEdyfc")                // 26.1.2-8.0.8
    integrationApi("maven.modrinth:rhino:SqkDvOLG")
    integrationRuntime("maven.modrinth:better-advanced-tooltips:DKhR2dA5") // KubeJS dependency
    // KubeJS nests tiny-java-server via jar-in-jar; the plain-JVM test classpath does not unpack it, and
    // RecipesKubeEvent's static init needs it. Keep the version in sync with KubeJS's META-INF/jarjar.
    testRuntimeOnly("dev.latvian.apps:tiny-java-server:1.0.0-build.45") { transitive = false }
    // Recipe-adapter targets: only needed at test/dev runtime.
    integrationRuntime("maven.modrinth:applied-generators:zqlEPjwN") // 0.3.1+26.1.2
    integrationRuntime("maven.modrinth:ae2-crystal-science:9wyPpLcp") // 26.1.2-1.1.12
    integrationRuntime("maven.modrinth:geckolib:xfVfPcoC")          // AdvancedAE dependency
    integrationRuntime("maven.modrinth:kotlin-lang-forge:Yt83RFhD") // Replication dependency
    integrationRuntime("maven.modrinth:titanium:ynzx60mi")          // Replication dependency
    // Kotlin for Forge nests kotlin-reflect, but the dev launcher does not pick it up next to LDLib2's Kotlin.
    integrationRuntime("org.jetbrains.kotlin:kotlin-reflect:2.4.21")

    legacyCompileOnly("maven.modrinth:ae2-lightning-tech:wchBNoWt")
    legacyCompileOnly("maven.modrinth:thunderbolt-core:i3H7uX2O")
    legacyCompileOnly("maven.modrinth:a-useless-mod:VX1feqRC")
    legacyCompileOnly("curse.maven:omnisequence-transfinite-1624558:8991983")
    legacyCompileOnly("curse.maven:ae2-pattern-disk-1698612:9009050")
    legacyCompileOnly("curse.maven:mekanism-268560:7904058")
    legacyCompileOnly("curse.maven:flux-networks-248020:6089446")
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.mockito:mockito-core:5.15.2')
    // taffy (via LDLib2) drags fastutil 8.5.12 onto the test runtime; Minecraft 26.1 needs the 8.5.18 it compiles against.
    testRuntimeOnly('it.unimi.dsi:fastutil:8.5.18')
    // Also needed at compile time: util/TestFmlLoaderSessionListener installs a stub FML loader for the isolated tests.
    testImplementation('org.junit.platform:junit-platform-launcher')
    // KeyMapping/EditBox tests need GLFW's native entry points, but never create a game window.
    def nativeOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def nativeClassifier = nativeOs.contains('win') ? 'natives-windows'
        : nativeOs.contains('mac') ? 'natives-macos' : 'natives-linux'
    if (System.getProperty('os.arch') in ['aarch64', 'arm64']) nativeClassifier += '-arm64'
    testRuntimeOnly("org.lwjgl:lwjgl:${lwjgl_version}:${nativeClassifier}")
    testRuntimeOnly("org.lwjgl:lwjgl-glfw:${lwjgl_version}:${nativeClassifier}")

    api("com.tterrag.registrate:Registrate:MC26.1-1.5.4")
    jarJar("com.tterrag.registrate:Registrate:MC26.1-1.5.4")

    implementation("org.appliedenergistics:appliedenergistics2:26.1.13-beta")
    implementation("org.appliedenergistics:guideme:26.1.17-beta")

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}")
    compileOnly("dev.vfyjxf:taffy:${taffy_version}")

    // implementation("curse.maven:applied-mekanistics-574300:7096962")

    implementation("curse.maven:glodium-957920:8196173")
    implementation("curse.maven:ex-pattern-provider-892005:9129055") // ExtendedAE 26.1-1.0.5
    // implementation("curse.maven:applied-flux-965012:8204513")

    // implementation("curse.maven:advancedae-1084104:7374386")

    implementation("maven.modrinth:jade:26.1.12+neoforge")

    // implementation("vazkii.botania:botania-neoforge-1.21.1:454-SNAPSHOT")
    // implementation("curse.maven:applied-botanics-addon-610632:7234122")
    // implementation(name: "appbot-1.6.0")

    // implementation("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.9.4.1182")
    // implementation("curse.maven:ars-energistique-905641:6203425")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // compileOnly("dev.emi:emi-neoforge:${emi_version}")
    // REI ghost-item dragging into LDLib2 filter slots (integration/rei). EMI has no 26.1 build yet.
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1") { transitive = false }

    // implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")

    // api("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
    // interfaceInjectionData("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
}

neoForge {
    version = project.neo_version

//    parchment {
//        mappingsVersion = project.parchment_mappings_version
//        minecraftVersion = project.parchment_minecraft_version
//    }

    runs {
        client {
            client()
            // `./gradlew runClient -PquickPlay=<world>` opens a singleplayer world directly.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        aeGuide {
            client()

            systemProperty 'guideme.ae2.guide.sources', file('guidebook').absolutePath
            systemProperty 'guideme.ae2.guide.sourcesNamespace', 'neoecoae'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            if (project.hasProperty('mixinAudit')) {
                systemProperty 'neoecoae.mixinAudit', 'true'
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
            jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // 26.1 port: the FML unit-test bootstrap (unitTest { enable() }) is disabled. The suite is main's isolated-JVM
    // contract tests: they reference classes in mixin packages directly (Mixin refuses that under FML) and need the
    // 1.21.1 compile-only integration jars on the classpath (FML would try to load those as mods and abort).
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources', 'src/guidebook/resources'
}

sourceSets.main.java {
    // 26.1.2 port: leaf integrations whose target mod has no ported 26.1.2 build yet.
    // Nothing in the core references these packages; see docs/26.1-migration-reduction-notes.md.
    exclude 'cn/dancingsnow/neoecoae/integration/appbot/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedcreate/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedpneumatics/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appliedsoul/**'
    exclude 'cn/dancingsnow/neoecoae/integration/appmek/**'
    exclude 'cn/dancingsnow/neoecoae/integration/arsenergistique/**'
    exclude 'cn/dancingsnow/neoecoae/integration/dataenergistics/**'
    exclude 'cn/dancingsnow/neoecoae/integration/emi/**'
    exclude 'cn/dancingsnow/neoecoae/integration/megacells/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/appbot/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/fluxnetworks/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/omnisequence/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/thunderbolt/**'
    exclude 'cn/dancingsnow/neoecoae/mixins/compat/useless/**'
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
    // As on main (1.21.1): isolated-JVM tests also need compile-only game libraries (e.g. MixinExtras' Operation).
    runtimeClasspath += sourceSets.main.compileClasspath
    // Contract tests for the compile-only legacy integrations need their classes at test runtime.
    runtimeClasspath += configurations.legacyCompileOnly
    java {
        // Tests of integrations excluded from the main source set (see sourceSets.main.java).
        exclude 'cn/dancingsnow/neoecoae/integration/emi/**'
        exclude 'cn/dancingsnow/neoecoae/integration/appmek/**'
        exclude 'cn/dancingsnow/neoecoae/integration/megacells/**'
        exclude 'cn/dancingsnow/neoecoae/integration/dataenergistics/**'
        exclude 'cn/dancingsnow/neoecoae/integration/appbot/**'
        exclude 'cn/dancingsnow/neoecoae/mixins/compat/**'
        // Tests of compat mixins excluded from the main source set.
        exclude 'cn/dancingsnow/neoecoae/compat/fluxnetworks/**'
        exclude 'cn/dancingsnow/neoecoae/compat/thunderbolt/ECOThunderboltMixinSelectionTest.java'
        exclude 'cn/dancingsnow/neoecoae/compat/thunderbolt/ECOThunderboltWorkstationBridgeTest.java'
        exclude 'cn/dancingsnow/neoecoae/compat/thunderbolt/ThunderboltRuntimeContractTest.java'
        exclude 'cn/dancingsnow/neoecoae/compat/ae2lt/ECOAe2LtIOPortTest.java'
        // Calls the 1.21.1 ae2lt overload API directly (ResourceLocation signatures); cannot compile against 26.1.
        exclude 'cn/dancingsnow/neoecoae/crafting/execution/ECOOverloadAccountingIntegrationTest.java'
        // Needs ae2-jei-integration, which has no jar on the classpath.
        exclude 'cn/dancingsnow/neoecoae/integration/jei/JeiBookmarkConversionTest.java'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '2G'
    // Mockito 5.15's Byte Buddy does not know Java 25 class files yet.
    systemProperty 'net.bytebuddy.experimental', 'true'
    systemProperty 'storage.performance', providers.systemProperty('storage.performance').getOrElse('false')
    systemProperty 'storage.performance.label', providers.systemProperty('storage.performance.label').getOrElse('current')
    systemProperty 'storage.performance.extended', providers.systemProperty('storage.performance.extended').getOrElse('false')
    systemProperty 'crafting.performance', providers.systemProperty('crafting.performance').getOrElse('false')
    systemProperty 'planner.challenge.enabled', providers.systemProperty('planner.challenge.enabled').getOrElse('false')
    systemProperty 'planner.challenge.profile', providers.systemProperty('planner.challenge.profile').getOrElse('default')
    systemProperty 'planner.challenge.case', providers.systemProperty('planner.challenge.case').getOrElse('')
}

tasks.register('copyGuidebook', Copy) {
    group = 'build'

    from 'guidebook/'
    into 'src/guidebook/resources/assets/neoecoae/ae2guide'
}

tasks.named('processResources').configure {
    dependsOn tasks.named('copyGuidebook')
    // Package the current guidebook sources instead of the stale checked-in resource copies.
    def legacyGuidebookRoot = layout.projectDirectory.dir('src/main/resources/assets/neoecoae/ae2guide').asFile.absolutePath + File.separator
    exclude { details -> details.file.absolutePath.startsWith(legacyGuidebookRoot) }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn delombok
    from delombok.outputs.files
    archiveClassifier = "sources"
}

artifacts {
    archives sourcesJar
}


lombok {
    version = "1.18.46"
}

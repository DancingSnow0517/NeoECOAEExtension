plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '9.5.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // 1.21.1 builds of optional integration targets, used only as compile-time API stubs
    // (see the legacyCompileOnly configuration). Never installed in any run.
    exclusiveContent {
        forRepository {
            ivy {
                name = "Bigger AE2 releases"
                url = "https://github.com/DancingSnow0517/BiggerAE2/releases/download"
                patternLayout {
                    artifact "[revision]/bigger_ae2-1.21.1-[revision].[ext]"
                }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup "github.biggerae2" }
    }
    flatDir {
        dir("libs")
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseForge Maven"
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // Registrate Fork
        name = "Ithundxr Maven"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {// Ldlib
        name "firstdarkdev"
        url "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023, botania
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven {
        // kubejs
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven {
        // emi
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.minecraftforge.net/" }
    maven { // Registrate
        url "https://maven.gegy.dev/releases"
    }
}

configurations {
    legacyCompileOnly { transitive = false }
    compileOnly.extendsFrom legacyCompileOnly
}


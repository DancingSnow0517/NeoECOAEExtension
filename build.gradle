import org.gradle.api.tasks.options.Option

plugins { id 'base' }

abstract class PlatformTestAlias extends DefaultTask {
    @Option(option = 'tests', description = 'Restrict the 1.21.1 tests; core tests remain independently verified.')
    void tests(String pattern) {
        project.project(':mc1211').tasks.named('test', Test).configure {
            filter.includeTestsMatching(pattern)
        }
    }
}
abstract class PlatformRunAlias extends DefaultTask {
    @Option(option = 'args', description = 'Program arguments forwarded to the selected platform run.')
    void arguments(String arguments) {
        def runName = name.substring(3)
        runName = runName.substring(0, 1).toLowerCase(Locale.ROOT) + runName.substring(1)
        def values = org.apache.tools.ant.types.Commandline.translateCommandline(arguments).toList()
        project.project(':mc1211').extensions.getByName('neoForge').runs.named(runName).configure {
            programArguments.addAll(values)
        }
    }
}

group = mod_group_id
version = mod_version
layout.buildDirectory = layout.projectDirectory.dir('.gradle/root-build')

tasks.named('wrapper', Wrapper) { distributionType = Wrapper.DistributionType.BIN }
// Preserve existing developer/CI commands while the platform lives in a real subproject.
def forwarded = ['compileJava', 'compileTestJava', 'jar', 'sourcesJar', 'runClient', 'runServer',
    'runData', 'runAeGuide', 'publish', 'publishToMavenLocal']
forwarded.each { taskName ->
    tasks.register(taskName, taskName.startsWith('run') ? PlatformRunAlias : DefaultTask) {
        impliesSubProjects = true
        dependsOn(":mc1211:${taskName}")
    }
}
tasks.register('test', PlatformTestAlias) {
    // A root selector must not apply --tests to the independently verified core suite.
    impliesSubProjects = true
    dependsOn ':core:test', ':mc1211:test'
}

tasks.named('publish') { dependsOn ':core:publish' }
tasks.named('publishToMavenLocal') { dependsOn ':core:publishToMavenLocal' }
tasks.named('check') { dependsOn ':core:check', ':mc1211:check' }
tasks.named('assemble') { dependsOn ':core:assemble', ':mc1211:assemble' }
tasks.named('clean') { dependsOn ':core:clean', ':mc1211:clean' }

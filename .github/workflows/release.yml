name: Release Neo ECO AE Extension

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, '20.')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Release tags have their own cache scope; retain it for retries of this release.
          cache-read-only: false
      - name: Read Properties
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
                            if '=' in line and not line.startswith('#'))
          version = properties['mod_version']
          assert os.environ['RELEASE_TAG'] == version, 'Release tag must match mod_version'
          assert properties['minecraft_version'] == '1.20.1'
          notes = Path(f'docs/releases/{version}.md')
          text = notes.read_text()
          assert '## 中文' in text and '## English' in text, 'Both languages are required'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nnotes={notes.as_posix()}\n')
          PY
      - name: Restore Pinned Dependency Cache
        id: pinned-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/pinned
          key: ${{ runner.os }}-neoecoae-pinned-v1-${{ hashFiles('tools/compat/build-dependencies.json') }}
      - name: Restore Build Dependencies
        run: python3 tools/compat/bootstrap.py
      - name: Save Verified Dependency Cache
        if: steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libs/pinned
          key: ${{ steps.pinned-cache.outputs.cache-primary-key }}
      - name: Build with Gradle
        id: gradle
        env:
          # ModDevGradle must compile the Java 17 Minecraft artifacts on CI too.
          CI: 'false'
        run: |
          set -o pipefail
          mkdir -p build/compat-build-evidence
          started_at=$SECONDS
          trap 'echo "GRADLE_BUILD_SECONDS=$((SECONDS - started_at))" >> "$GITHUB_ENV"' EXIT
          bash ./gradlew -I tools/compat/ci.init.gradle build \
            --no-daemon --no-parallel --max-workers=2 --console=plain --profile \
            '-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8' \
            2>&1 | tee build/compat-build-evidence/build.log
      - name: Verify Release Jar
        run: python3 tools/compat/check_artifacts.py --release-only
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoecoae-${{ steps.release.outputs.version }}
          path: |
            build/libs/neoecoae-${{ steps.release.outputs.version }}.jar
            build/libs/neoecoae-${{ steps.release.outputs.version }}-sources.jar
          if-no-files-found: error
      - name: Summarize Build and Cache Usage
        if: always()
        env:
          CI_BUILD_RESULT: ${{ steps.gradle.outcome }}
          PINNED_CACHE_HIT: ${{ steps.pinned-cache.outputs.cache-hit }}
        run: python3 tools/compat/build_summary.py
      - name: Upload Verification Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ steps.release.outputs.version }}
          path: |
            build/compat-build-evidence/
            build/reports/profile/
            build/reports/problems/
          if-no-files-found: ignore
      - name: Publish Mod
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          name: Neo ECO AE Extension v${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog-file: ${{ steps.release.outputs.notes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          modrinth-id: udZtKfzP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1460639
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          loaders: forge
          game-versions: '1.20.1'
          java: '17'
          environment: 'client | server'
          files: |
            build/libs/neoecoae-${{ steps.release.outputs.version }}.jar
            build/libs/neoecoae-${{ steps.release.outputs.version }}-sources.jar

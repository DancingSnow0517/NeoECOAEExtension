name: CI for Neo ECO AE Extension

on:
  # GitHub schedules require this workflow on the default branch.
  # Every Monday at 03:17 UTC; build the latest 1.20.1 source below.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: ['1.20.1']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/compat/**'
      - '.github/workflows/compat.yml'
  pull_request:
    branches: ['1.20.1']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/compat/**'
      - '.github/workflows/compat.yml'

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && '1.20.1' || github.sha }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Compatibility Harness
        run: python3 -m unittest discover -s tools/compat/tests -v
      - name: Restore Build Dependencies
        run: python3 tools/compat/bootstrap.py
      - name: Build with Gradle
        env:
          # ModDevGradle skips recompilation for CI=true; its binary mappings fail Java 17 compilation.
          CI: 'false'
        run: |
          set -o pipefail
          mkdir -p build/compat-build-evidence
          bash ./gradlew -I tools/compat/compat.init.gradle reobfJar reobfCompatTestJar --no-daemon --max-workers=2 --console=plain 2>&1 | tee build/compat-build-evidence/build.log
      - name: Verify KubeJS Recipe Schemas
        env:
          CI: 'false'
        run: |
          set -o pipefail
          bash ./gradlew upstreamSyncTest --tests 'cn.dancingsnow.neoecoae.integration.kubejs.schema.KubeJSRecipeSchemaTest' --no-daemon --max-workers=2 --console=plain 2>&1 | tee build/compat-build-evidence/kubejs-schemas.log
      - name: Verify Production Artifacts
        run: python3 tools/compat/check_artifacts.py
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoeco-compat-test-jars
          path: |
            build/libs/neoecoae-*.jar
            build/libs/neoeco-compat-tests-*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload Verification Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-build-evidence
          path: |
            build/compat-build-evidence/
            build/reports/problems/
            build/test-results/upstreamSyncTest/
            build/reports/tests/upstreamSyncTest/
          if-no-files-found: ignore
          retention-days: 14

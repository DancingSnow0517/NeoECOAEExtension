name: compat

on:
  # GitHub schedules require this workflow on the default branch.
  # Every Monday at 03:17 UTC; build the latest 1.20.1 source below.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: ['1.20.1']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/compat/**'
      - '.github/workflows/compat.yml'
  pull_request:
    branches: ['1.20.1']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/compat/**'
      - '.github/workflows/compat.yml'

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1.20.1' || github.sha }}
      - name: Record Source Commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Compatibility Harness
        run: python3 -m unittest discover -s tools/compat/tests -v
      - name: Restore Build Dependencies
        run: python3 tools/compat/bootstrap.py
      - name: Build with Gradle
        env:
          # ModDevGradle skips recompilation for CI=true; its binary mappings fail Java 17 compilation.
          CI: 'false'
        run: |
          set -o pipefail
          mkdir -p build/compat-build-evidence
          bash ./gradlew -I tools/compat/compat.init.gradle reobfJar reobfCompatTestJar --no-daemon --max-workers=2 --console=plain 2>&1 | tee build/compat-build-evidence/build.log
      - name: Verify KubeJS Recipe Schemas
        env:
          CI: 'false'
        run: |
          set -o pipefail
          bash ./gradlew upstreamSyncTest --tests 'cn.dancingsnow.neoecoae.integration.kubejs.schema.KubeJSRecipeSchemaTest' --no-daemon --max-workers=2 --console=plain 2>&1 | tee build/compat-build-evidence/kubejs-schemas.log
      - name: Verify Production Artifacts
        run: python3 tools/compat/check_artifacts.py
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoeco-compat-test-jars
          path: |
            build/libs/neoecoae-*.jar
            build/libs/neoeco-compat-tests-*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload Verification Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-build-evidence
          path: |
            build/compat-build-evidence/
            build/reports/problems/
            build/test-results/upstreamSyncTest/
            build/reports/tests/upstreamSyncTest/
          if-no-files-found: ignore
          retention-days: 14

  gtl:
    name: GTL (latest stable CurseForge pack)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout Built Source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Built JARs
        uses: actions/download-artifact@v4
        with:
          name: neoeco-compat-test-jars
          path: build/libs
      # Each variant uses a fresh world and pack configuration. Both servers run concurrently.
      # These isolated servers accept Minecraft's EULA: https://aka.ms/MinecraftEULA.
      - name: Test Latest GTL with Built NeoECO
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          python3 tools/compat/gtl.py --accept-eula \
            --neoeco "build/libs/neoecoae-$version.jar" \
            --probe "build/libs/neoeco-compat-tests-$version.jar" \
            --output build/compat/gtl --memory 6G --timeout 1500
      - name: Publish Compatibility Summary
        if: always()
        run: |
          if [ -f build/compat/gtl/summary.md ]; then cat build/compat/gtl/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload Compatibility Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtl-compatibility-evidence
          path: build/compat/gtl/evidence/
          if-no-files-found: warn
          retention-days: 14

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

// The root coordinates the platform adapter and independently compiled reusable library.
rootProject.name = 'neoecoae'
include 'core', 'mc1211'
// Keep existing source/resource/run paths stable while giving the adapter its own task namespace.
project(':mc1211').projectDir = file('mc1211')
